name: Index PDFs and notify consumers

on:
  push:
    branches: [main]
    paths:
      - '**.[pP][dD][fF]'
      - 'manifests/**'
      - 'tools/index_archive.py'
      - 'tools/import_legacy_pdfs.py'
      - '.github/workflows/notify-pdf-consumers.yml'
  workflow_dispatch:
    inputs:
      import_legacy:
        description: Preserve all current diploma-notes PDFs in the archive
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pdf-archive-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test archive indexing and preservation
        run: python -m unittest discover -s tests -p 'test_archive_index.py' -v
      - name: Configure archive commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Decide whether legacy import is needed
        id: legacy
        env:
          FORCE_IMPORT: ${{ inputs.import_legacy || false }}
        run: |
          if [ "$FORCE_IMPORT" = true ] || [ ! -f manifests/legacy-diploma-notes.json ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out original PDFs for preservation
        if: steps.legacy.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: nandurpm/diploma-notes
          ref: main
          path: legacy-source
          sparse-checkout: |
            **/*.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Preserve and verify legacy PDFs
        if: steps.legacy.outputs.needed == 'true'
        run: |
          python tools/import_legacy_pdfs.py "$GITHUB_WORKSPACE/legacy-source" "$GITHUB_WORKSPACE" --push
          rm -rf legacy-source
      - name: Index uploads and validate lesson manifests
        run: python tools/index_archive.py
      - name: Commit derived manifests and preserved PDFs
        id: archive
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests
          if [ -d legacy ]; then git add legacy; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Index PDF uploads and preserve legacy archive'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not trigger another push workflow. Dispatch here,
      # after indexing, using the actual resulting archive commit.
      - name: Notify both consumers after publication
        uses: actions/github-script@v7
        env:
          ARCHIVE_SHA: ${{ steps.archive.outputs.sha }}
        with:
          github-token: ${{ secrets.PDF_CONSUMERS_TOKEN || secrets.CROSS_REPO_SYNC_TOKEN }}
          script: |
            const failures = [];
            for (const repo of ['diploma-notes', 'polypmna']) {
              try {
                await github.rest.repos.createDispatchEvent({
                  owner: 'nandurpm', repo, event_type: 'pdf-archive-updated',
                  client_payload: {
                    source_repository: 'nandurpm/poly-pmna-pdf-files',
                    source_sha: process.env.ARCHIVE_SHA,
                    source_ref: 'main'
                  }
                });
                core.info(`Notified ${repo}`);
              } catch (error) { failures.push(`${repo}: ${error.message}`); }
            }
            if (failures.length) core.setFailed(failures.join('\n'));
