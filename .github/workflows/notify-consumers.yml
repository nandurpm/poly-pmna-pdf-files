name: Notify PDF archive consumers

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "manifests/**"
      - "sitttr/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-pdf-consumers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify ${{ matrix.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - nandurpm/diploma-notes
          - nandurpm/polypmna
    steps:
      - name: Require the cross-repository token
        env:
          SYNC_TOKEN: ${{ secrets.CROSS_REPO_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "CROSS_REPO_SYNC_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Send archive-updated event
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_SYNC_TOKEN }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg sourceRepository "$SOURCE_REPOSITORY" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceRef "$SOURCE_REF" \
            --arg manifestBaseUrl "https://raw.githubusercontent.com/${SOURCE_REPOSITORY}/${SOURCE_REF}/manifests" \
            '{
              event_type: "pdf-archive-updated",
              client_payload: {
                source_repository: $sourceRepository,
                source_sha: $sourceSha,
                source_ref: $sourceRef,
                manifest_base_url: $manifestBaseUrl
              }
            }')

          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPOSITORY}/dispatches" \
            --data "$payload"
