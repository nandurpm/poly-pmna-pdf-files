name: Verify PDF deduplication
on:
  pull_request:
    paths:
      - 'manifests/**'
      - 'tools/**'
      - 'tests/**'
      - 'sitttr/**'
      - '.github/workflows/verify-pdf-deduplication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            manifests
            tools
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/verify_pdf_deduplication.py
